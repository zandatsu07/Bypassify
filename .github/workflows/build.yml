name: Build APK

on:
  push:
    tags: ['v*']          # e.g. tag v1.0 -> builds + publishes a Release
  workflow_dispatch:      # manual run from the Actions tab (uploads APK as an artifact only)

permissions:
  contents: write         # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The Android SDK is preinstalled on ubuntu-latest; just make sure licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BypassCharging-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BypassCharging-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
